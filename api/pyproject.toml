# O Vercel instala as dependências da API a partir daqui.
# Manter igual a requirements.txt (que é o que usamos localmente e no CI).
[project]
name = "clarity-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]  # T20 proíbe print(): nada de dados de pacientes na consola

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
