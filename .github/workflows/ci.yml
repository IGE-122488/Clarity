name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Python) — ruff e pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version-file: api/.python-version
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Ruff (estilo e erros)
        run: |
          ruff check .
          ruff format --check .
      - name: Testes
        run: pytest -q

  frontend:
    name: Frontend (React) — lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      # Valores fictícios só para o build passar no CI. Nunca chaves reais aqui.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_APP_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
